<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>전자서명확인서 | 세주세무회계사무소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
:root{--bg:#eef0ee;--ink:#1b222c;--muted:#5d6672;--line:#d3d8d3;--accent:#1f4a73;--seal:#b3261e;--ok:#2e6b3f;
 --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-doc:"Nanum Myeongjo","AppleMyungjo","Batang",serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.top{background:var(--accent);color:#fff;padding:14px max(16px,env(safe-area-inset-left)) 14px max(16px,env(safe-area-inset-right));padding-top:calc(14px + env(safe-area-inset-top))}
.top b{font-size:16px}.top div{font-size:12.5px;opacity:.85}
.wrap{max-width:760px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-left)) 40px max(12px,env(safe-area-inset-right))}
.guide{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px;border:1px solid var(--line)}
.guide ol{margin:6px 0 0;padding-left:20px}
.paper{background:#fffefb;color:#1a1a1a;font-family:var(--f-doc);padding:34px 30px 30px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.paper h1{font-weight:800;font-size:22px;text-align:center;letter-spacing:.1em;margin:0 0 6px;text-indent:.1em;text-wrap:balance}
.docno{text-align:center;font-size:12px;color:#555;margin-bottom:20px;font-family:var(--f-body)}
.lead{font-size:14.5px;line-height:1.85;margin:0 0 16px;text-align:justify}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 18px;font-family:var(--f-body)}
table.dt th,table.dt td{border:1px solid #444;padding:6px 8px;text-align:left;vertical-align:top}
table.dt th{background:#f1f0eb;width:32%;font-weight:600}
h3{font-size:15.5px;font-weight:800;margin:20px 0 8px;border-bottom:1.5px solid #222;padding-bottom:4px}
ol.items{margin:0;padding:0;list-style:none;counter-reset:it}
ol.items li{counter-increment:it;display:grid;grid-template-columns:26px minmax(0,1fr) 70px;gap:6px;padding:10px 0;border-bottom:1px solid #ddd;font-size:14.5px;line-height:1.75}
ol.items li::before{content:counter(it) ".";font-weight:700}
.chk{font-family:var(--f-body);font-size:12.5px;border:1.5px solid #999;border-radius:6px;min-height:34px;display:grid;place-items:center;color:#777;background:#fff;cursor:pointer;padding:0 4px;align-self:start}
.chk.y{border-color:var(--seal);color:var(--seal);font-weight:700}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.closing{font-size:14.5px;line-height:1.85;margin:18px 0 20px}
.date{text-align:center;font-size:15px;margin:16px 0 18px;letter-spacing:.06em}
.sig{display:grid;grid-template-columns:auto minmax(0,1fr) 140px;gap:10px;align-items:center;font-size:14.5px;margin:6px 0}
.sig .lbl{text-align:right}.sig .nm{font-weight:700;letter-spacing:.12em;text-align:right}
.sig .mark{height:56px;border-bottom:1px solid #999;display:grid;place-items:center;color:#aaa;font-size:12px;font-family:var(--f-body)}
.sig .mark img{max-height:56px;max-width:140px}
.to{margin-top:24px;font-size:16px;font-weight:800}
.office{margin-top:16px;border-top:1px solid #bbb;padding-top:10px;font-size:11.5px;color:#444;font-family:var(--f-body)}
.card{background:#fff;border-radius:10px;padding:14px;margin-top:14px;border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-top:10px}
input.in{border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;color:var(--ink)}
.pad{width:100%;height:180px;border:1.5px solid var(--line);border-radius:8px;background:#fff;touch-action:none;display:block;margin-top:6px}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);width:100%;padding:14px;font-size:16px;margin-top:14px}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.err{color:var(--seal);font-size:13.5px;margin-top:8px;min-height:1em}
.done{background:#e1efe4;color:var(--ok);border-radius:10px;padding:14px;margin-top:14px;font-size:14.5px}
.done a{color:var(--accent);font-weight:600}
.bad{background:#fff;border-radius:10px;padding:24px;text-align:center}
@media (max-width:520px){.paper{padding:24px 16px}.sig{grid-template-columns:minmax(0,1fr) 120px}.sig .lbl{grid-column:1/3;text-align:left}ol.items li{grid-template-columns:22px minmax(0,1fr) 62px}}
</style>
</head>

<script>
/* === 세주 전자서명확인서 링크 코덱 v2 (app·sign 공용) === */
const SJ_PH=['에 관하여 설명을 듣고 그 사실관계가 신고 내용과 같음을 확인합니다.','임을 확인합니다.','음을 확인합니다.','하였음을 확인합니다.','확인합니다.','본인은 ','본인(법정대리인)은 ','수증자는 ','세무대리인','세무사 사무소','설명을 들었습니다','양도소득세','증여세','상속세','종합소득세','부가가치세','법인세','2026년 ','2027년 ','2025년 ','월 ','일 ','원을 ','원(','만원','주택','계약금','매매계약','양도일','취득','증여일','증여재산','공제','신고서','신고','제출하','하였','있으며','없음','있음','이전','이후','현재','실제로 ','사실이 ','관련 ','세무서','납부','가산세','이 주택','이 집','부동산','분양권','입주권','주식','자녀','배우자','부모','증빙','이체내역','확인서','사실관계','국내','거주'];
const SJ_LB=['신고인','세목·구분','신고 내용','양도가액','취득가액','과세표준','산출세액','납부할 세액','자진납부할 세액','증여재산가액','증여세 과세가액','증여재산공제(직계존속)','접수번호','접수일','결정세액','과세가액'];
function sjStdItems(t){return [`본인은 위 ${t} 신고서와 첨부서류의 내용을 설명받았으며, 신고 내용이 본인이 알고 있는 사실 및 제공한 자료와 같음을 확인합니다.`,
 `본인이 제공한 자료나 사실관계가 실제와 다르거나 누락된 자료가 있어 추가 세액·가산세가 생기는 경우, 그 책임은 본인에게 있음을 확인합니다.`,
 `신고 후 세무서의 소명 요청이나 해명 안내를 받으면 즉시 세무대리인에게 알리겠습니다.`]}
function sjIntro(t){return `본인은 세주세무회계사무소(이태현 세무사)에 ${t} 신고 대리를 의뢰하였고, 아래와 같이 신고되었음을 확인합니다.`}
const SJ_CLOSE='위 사항을 충분히 설명받고 이해하였으며, 각 항목을 직접 확인하고 서명합니다.';
const SJ_TT=['양도소득세','증여세','상속세','종합소득세','부가가치세','법인세','종합부동산세','취득세'];
function sjSub(s,enc){ if(enc){ SJ_PH.forEach((p,i)=>{s=s.split(p).join(String.fromCharCode(0xE000+i))}); return s; } return s.replace(/[-]/g,ch=>SJ_PH[ch.charCodeAt(0)-0xE000]??''); }
function sjB64(u){let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function sjUnB64(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function sjPipe(u,stream){const w=stream.writable.getWriter();w.write(u).catch(()=>{});w.close().catch(()=>{});return new Uint8Array(await new Response(stream.readable).arrayBuffer())}
async function sjDeflate(u){ try{ if(window.CompressionStream) return await sjPipe(u,new CompressionStream('deflate-raw')); }catch(e){} if(window.pako) return pako.deflateRaw(u,{level:9}); throw new Error('이 브라우저는 압축을 지원하지 않습니다'); }
async function sjInflate(u){ try{ if(window.DecompressionStream) return await sjPipe(u,new DecompressionStream('deflate-raw')); }catch(e){} if(window.pako) return pako.inflateRaw(u); throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다'); }
/* doc: {tax:'양도소득세', kind:'예정신고', title, intro, summary:[[k,v]], items:[], closing, signer, guardian, guardianName, docNo, issuedAt} */
async function sjPack(doc){
  const t=doc.tax||''; const std=sjStdItems(t);
  const ti=SJ_TT.indexOf(t);
  const arr=[ti>=0?ti:t, doc.kind||'', (doc.docNo||'').replace(/^세주-확인-/,''), (doc.issuedAt||'').replace(/-/g,''), doc.signer||'', doc.guardian?(doc.guardianName||'')+'\u0001':'',
    doc.intro&&doc.intro!==sjIntro(t)?doc.intro:'', doc.closing&&doc.closing!==SJ_CLOSE?doc.closing:'',
    (doc.summary||[]).map(([k,v])=>{const i=SJ_LB.indexOf(k);return (i>=0?String.fromCharCode(0xE100+i):k+'\u0003')+v}).join('\u0002'),
    (doc.items||[]).map(x=>{const i=std.indexOf(x);return i>=0?String.fromCharCode(0xE180+i):x}).join('\u0002')];
  const s=sjSub(arr.join('\u0004'),true);
  const u=new Uint8Array(s.length*2); for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);u[2*i]=c&255;u[2*i+1]=c>>8}
  return '2'+sjB64(await sjDeflate(u));
}
async function sjUnpack(code){
  const u=await sjInflate(sjUnB64(code.slice(1)));
  let s=''; for(let i=0;i+1<u.length;i+=2) s+=String.fromCharCode(u[i]|(u[i+1]<<8));
  const a=sjSub(s,false).split('\u0004');
  const t=/^\d+$/.test(a[0])?SJ_TT[+a[0]]:a[0]; const std=sjStdItems(t);
  return {tax:t, kind:a[1], docNo:a[2]?'세주-확인-'+a[2]:'', issuedAt:a[3]?`${a[3].slice(0,4)}-${a[3].slice(4,6)}-${a[3].slice(6,8)}`:'', signer:a[4],
    guardian:a[5].endsWith('\u0001'), guardianName:a[5].replace('\u0001',''), intro:a[6]||sjIntro(t), closing:a[7]||SJ_CLOSE,
    summary:a[8]?a[8].split('\u0002').map(r=>{const c=r.charCodeAt(0);if(c>=0xE100&&c<0xE180)return [SJ_LB[c-0xE100],r.slice(1)];const k=r.indexOf('\u0003');return [r.slice(0,k),r.slice(k+1)]}):[],
    items:a[9]?a[9].split('\u0002').map(x=>{const c=x.charCodeAt(0);return x.length===1&&c>=0xE180&&c<0xE190?std[c-0xE180]:x}):[]};
}

/* === 짧은 링크: 구글 시트(암호문) === */
const SJ_SHEET='1DUy6sMxMb2pIeTxzKDnePaoHYfbVbp0vUAe-lJAifOU';
async function sjEncrypt(text){const key=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['encrypt']);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text)));const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return {key:sjB64(key),data:sjB64(all)}}
async function sjDecrypt(data,keyB64){const all=sjUnB64(data),key=sjUnB64(keyB64);const k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},k,all.slice(12));return new TextDecoder().decode(pt)}
function sjNewId(){return sjB64(crypto.getRandomValues(new Uint8Array(6)))}
async function sjFetchRow(id){const tq=encodeURIComponent(`select B where A = '${id}'`);const r=await fetch(`https://docs.google.com/spreadsheets/d/${SJ_SHEET}/gviz/tq?tqx=out:json&headers=1&tq=${tq}&_=${Date.now()}`);const t=await r.text();const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));if(j.status==='error')throw new Error('sheet');const row=j.table&&j.table.rows&&j.table.rows[0];return row&&row.c&&row.c[0]?row.c[0].v:null}

const OFFICE={name:'세주세무회계사무소',cpa:'이태현 세무사',tel:'02-2205-0659 / 010-6510-0659',fax:'02-2205-0657',email:'sejutaxmapo@gmail.com',addr:'서울시 마포구 독막로 239 성진빌딩 4층',kakao:'http://pf.kakao.com/_nrRhK'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function korDate(s){const m=String(s||'').match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);return m?`${m[1]}년 ${+m[2]}월 ${+m[3]}일`:s}
async function decode(code){
  const b=atob(code.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u);w.close();
  return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
}
function pad(canvas){
  const ctx=canvas.getContext('2d');let dr=false,has=false,last=null;
  const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.scale(dpr,dpr);
  ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  const pos=e=>{const b=canvas.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
  canvas.onpointerdown=e=>{dr=true;has=true;last=pos(e);canvas.setPointerCapture(e.pointerId)};
  canvas.onpointermove=e=>{if(!dr)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};
  canvas.onpointerup=canvas.onpointercancel=()=>dr=false;
  return{clear(){ctx.clearRect(0,0,canvas.width,canvas.height);has=false},empty:()=>!has,data:()=>canvas.toDataURL('image/png')};
}
function docHTML(d,st){
  return `<div class="paper" id="paper"><h1>전자서명확인서</h1><div class="docno">${esc(d.sub||'')}${d.sub&&d.no?' · ':''}${esc(d.no||'')}</div>
  <p class="lead">${esc(d.i)}</p>
  <table class="dt"><tbody>${(d.s||[]).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>
  <h3>확인 사항</h3>
  <ol class="items">${(d.it||[]).map((t,i)=>`<li><span>${esc(t)}</span>${st.final?`<span class="chk ${st.checks[i]?'y':''}">${st.checks[i]?'확인함':'확인'}</span>`:`<button type="button" class="chk ${st.checks[i]?'y':''}" data-k="${i}" aria-pressed="${!!st.checks[i]}">${st.checks[i]?'확인함':'확인'}</button>`}</li>`).join('')}</ol>
  <p class="closing">${esc(d.c)}</p>
  <div class="date">${st.date?korDate(st.date):'&nbsp;&nbsp;&nbsp;&nbsp;년&nbsp;&nbsp;&nbsp;월&nbsp;&nbsp;&nbsp;일'}</div>
  <div class="sig"><span class="lbl">확인자(신고인)</span><span class="nm">${esc(st.name||d.sg)}</span><span class="mark">${st.img?`<img src="${st.img}" alt="서명">`:'(서명)'}</span></div>
  ${d.g?`<div class="sig"><span class="lbl">법정대리인(친권자)</span><span class="nm">${esc(st.gname||d.gn||'')}</span><span class="mark">${st.gimg?`<img src="${st.gimg}" alt="법정대리인 서명">`:'(서명)'}</span></div>`:''}
  <div class="to">${OFFICE.name} ${OFFICE.cpa} 귀하</div>
  <div class="office">${OFFICE.name} · ${OFFICE.cpa} · ${OFFICE.addr}<br>전화 ${OFFICE.tel} · 팩스 ${OFFICE.fax} · ${OFFICE.email}${st.at?`<br>전자서명 일시 ${esc(st.at)} · ${esc(st.ua||'')}`:''}</div></div>`;
}
(async()=>{
  const app=$('#app');
  const UA=navigator.userAgent, isKakao=/KAKAOTALK/i.test(UA), isAndroid=/Android/i.test(UA);
  const openExt=()=>{const h=location.href; if(isKakao){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(h);return} if(isAndroid){location.href='intent://'+h.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end'}};
  let kx=null; try{kx=sessionStorage.getItem('sj.kx')}catch(e){}
  if(isKakao&&!kx){try{sessionStorage.setItem('sj.kx','1')}catch(e){} setTimeout(openExt,300)}
  const sp=new URLSearchParams(location.search); let qc=sp.get('c'); const qs=sp.get('s');
  if(qs){ app.innerHTML='<div class="bad">확인서를 불러오고 있습니다…</div>';
    try{ const id=qs.slice(0,8), key=qs.slice(8); let row=null;
      for(let i=0;i<3&&!row;i++){ row=await sjFetchRow(id); if(!row) await new Promise(r=>setTimeout(r,2500)); }
      if(!row){app.innerHTML=`<div class="bad"><b>확인서를 아직 불러올 수 없습니다.</b><p>방금 받은 링크라면 1~2분 뒤 다시 열어 주세요.<br>계속 안 열리면 사무소로 연락해 주세요. ${OFFICE.tel}</p></div>`;return}
      qc=await sjDecrypt(row,key);
    }catch(e){app.innerHTML=`<div class="bad"><b>확인서를 불러오지 못했습니다.</b><p>링크 전체가 그대로인지 확인해 주시고, 계속 안 되면 사무소로 연락해 주세요.<br>${OFFICE.tel}</p></div>`;return}
  }
  const m=qc?[null,qc]:location.hash.match(/#c=([A-Za-z0-9_-]+)/);
  if(!m){app.innerHTML=`<div class="bad"><b>확인서 정보가 없는 주소입니다.</b><p>사무실에서 보낸 링크 전체를 다시 눌러 주세요.<br>문의 ${OFFICE.tel}</p></div>`;return}
  let P; try{
    if(qc){ const x=await sjUnpack(qc); P={d:{t:'전자서명확인서',sub:`${x.tax} ${x.kind} 신고내용 확인`.replace(/\s+/g,' ').trim(),no:x.docNo,i:x.intro,s:x.summary,it:x.items,c:x.closing,sg:x.signer,g:x.guardian?1:0,gn:x.guardianName}}; }
    else P=await decode(m[1]);
  }catch(e){app.innerHTML=`<div class="bad"><b>링크가 손상되었습니다.</b><p>링크가 잘리지 않았는지 확인하시고, 다시 받아 주세요.<br>문의 ${OFFICE.tel}</p></div>`;return}
  const d=P.d; const st={checks:d.it.map(()=>false),name:d.sg,gname:d.gn};
  app.innerHTML=(isKakao?`<div class="guide" style="background:#fff8e1"><b>카카오톡 안에서는 서명 PDF 저장이 안 될 수 있습니다.</b><br>아래 버튼으로 휴대폰 기본 브라우저(크롬·사파리)에서 열어 주세요.<div style="margin-top:8px"><button class="btn sm" id="openExt" type="button">기본 브라우저로 열기</button></div></div>`:'')+`<div class="guide"><b>${esc(d.sg)}님, 신고내용 확인을 부탁드립니다.</b><ol><li>확인서의 각 항목을 읽고 오른쪽 <b>확인</b> 버튼을 누릅니다.</li><li>아래에 성명을 적고 서명합니다.</li><li><b>서명 완료</b>를 누른 뒤 <b>카카오톡으로 보내기</b>로 세주세무회계에 보내 주세요.</li></ol></div>
   <div id="doc"></div>
   <div class="card"><h2>서명</h2>
    <label class="f">확인자 성명<input class="in" id="nm" value="${esc(d.sg)}" autocomplete="name"></label>
    <div class="row" style="margin-top:10px"><span style="font-size:13px;color:var(--muted)">확인자 서명 (손가락으로 써 주세요)</span><button class="btn sm" id="c1" type="button">지우기</button></div><canvas class="pad" id="p1"></canvas>
    ${d.g?`<label class="f">법정대리인 성명<input class="in" id="gn" value="${esc(d.gn||'')}"></label><div class="row" style="margin-top:10px"><span style="font-size:13px;color:var(--muted)">법정대리인 서명</span><button class="btn sm" id="c2" type="button">지우기</button></div><canvas class="pad" id="p2"></canvas>`:''}
    <div class="err" id="err"></div>
    <button class="btn pri" id="ok" type="button">서명 완료</button></div>
   <div id="after"></div>`;
  const drawDoc=()=>{$('#doc').innerHTML=docHTML(d,st);document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.checks[+b.dataset.k]=!st.checks[+b.dataset.k];drawDoc()})};
  drawDoc(); const oe=document.getElementById('openExt'); if(oe) oe.onclick=openExt;
  const p1=pad($('#p1')),p2=d.g?pad($('#p2')):null;
  $('#c1').onclick=()=>p1.clear(); if(p2)$('#c2').onclick=()=>p2.clear();
  $('#ok').onclick=async()=>{
    const err=$('#err'); err.textContent='';
    if(st.checks.some(x=>!x)){err.textContent='확인 사항 '+(st.checks.findIndex(x=>!x)+1)+'번부터 모든 항목의 [확인] 버튼을 눌러 주세요.';document.querySelector('[data-k]:not(.y)')?.scrollIntoView({behavior:'smooth',block:'center'});return}
    if(!$('#nm').value.trim()){err.textContent='성명을 입력해 주세요.';return}
    if(p1.empty()||(p2&&p2.empty())){err.textContent='서명란에 서명해 주세요.';return}
    const now=new Date(); st.final=true; st.name=$('#nm').value.trim(); st.gname=p2?$('#gn').value.trim():''; st.img=p1.data(); st.gimg=p2?p2.data():'';
    st.date=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`; st.at=now.toLocaleString('ko-KR'); st.ua=(navigator.userAgent.match(/(iPhone|Android|Windows|Macintosh)/)||['모바일'])[0]+' 전자서명';
    drawDoc(); $('#ok').disabled=true; $('#ok').textContent='PDF를 만들고 있습니다…';
    try{
      await document.fonts.ready;
      const el=$('#paper'); const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',windowWidth:794});
      const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'}); const W=210,H=297,ih=cv.height*W/cv.width; const img=cv.toDataURL('image/jpeg',0.92);
      if(ih<=H)pdf.addImage(img,'JPEG',0,0,W,ih); else{let y=0;while(y<ih){pdf.addImage(img,'JPEG',0,-y,W,ih);y+=H;if(y<ih)pdf.addPage()}}
      const fn=`${st.name}_전자서명확인서_서명본.pdf`;
      const pdfFile=new File([pdf.output('blob')],fn,{type:'application/pdf'});
      const jpgBlob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
      const jpgFile=new File([jpgBlob],fn.replace('.pdf','.jpg'),{type:'image/jpeg'});
      const canShare=f=>!!(navigator.canShare&&navigator.canShare({files:[f]}));
      $('#ok').textContent='서명 완료'; $('#ok').hidden=true;
      $('#after').innerHTML=`<div class="done"><b>서명을 마쳤습니다.</b><br>아래 <b>카카오톡으로 보내기</b>를 누르고, 공유 목록에서 <b>카카오톡 → 세주세무회계</b> 채팅방을 골라 보내 주세요.
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
          <button class="btn pri" style="margin:0;background:#fee500;color:#191919;border-color:#fee500" id="shPdf" type="button">카카오톡으로 보내기 (PDF)</button>
          <button class="btn" id="shJpg" type="button">사진으로 보내기 (PDF가 안 보내질 때)</button>
          <button class="btn" id="svPdf" type="button">PDF 내 휴대폰에 저장</button>
          <a class="btn" style="text-align:center;text-decoration:none" href="${OFFICE.kakao}/chat" target="_blank" rel="noopener">세주세무회계 카카오톡 채널 열기</a>
        </div><div id="shMsg" style="margin-top:8px;font-size:13px"></div>
        <div style="margin-top:8px;font-size:12.5px;color:#555">메일로 보내실 때: ${OFFICE.email}</div></div>`;
      const msg=t=>{$('#shMsg').textContent=t};
      const share=async f=>{
        if(canShare(f)){ try{ await navigator.share({files:[f],title:'전자서명확인서',text:`[전자서명확인서] ${st.name} 서명본입니다.`}); msg('보내기 화면을 열었습니다. 카카오톡에서 세주세무회계 채팅방을 골라 주세요.'); }catch(e){ if(e.name!=='AbortError') msg('보내기를 열지 못했습니다. PDF 저장 후 채널에서 첨부해 주세요.'); } }
        else { const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; a.click(); msg('이 기기는 바로 보내기를 지원하지 않아 파일로 저장했습니다. 카카오톡 채널을 열어 저장된 파일을 첨부해 주세요.'); }
      };
      $('#shPdf').onclick=()=>share(pdfFile); $('#shJpg').onclick=()=>share(jpgFile);
      $('#svPdf').onclick=()=>{ pdf.save(fn); msg('PDF를 저장했습니다.'); };
      $('#after').scrollIntoView({behavior:'smooth'});
    }catch(e){$('#ok').disabled=false;$('#ok').textContent='서명 완료';err.textContent='PDF를 만들지 못했습니다. 화면을 캡처해 보내 주세요.'}
  };
})();
</script>
</body>
</html>
